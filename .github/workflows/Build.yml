name: Build Android App

on:
  workflow_dispatch:
    inputs:
      AppName:
        description: 'App Name'
        required: true
        default: 'WaveGame'
      AppPackage:
        description: 'Package (com.yourname.wave)'
        required: true
        default: 'com.my.wavegame'
      AppVersion:
        description: 'Version Name'
        required: true
        default: '1.0'
      AppVersionCode:
        description: 'Version Code'
        required: true
        default: '1'
      Solar2DBuild:
        description: 'Solar2D Build (2026.3736)'
        required: true
        default: '2026.3736'

env:
  APP_NAME: '${{ inputs.AppName }}'
  APP_PACKAGE: '${{ inputs.AppPackage }}'
  APP_VERSION_NAME: '${{ inputs.AppVersion }}'
  APP_VERSION_CODE: '${{ inputs.AppVersionCode }}'
  S2D_BUILD_NAME: '${{ inputs.Solar2DBuild }}'
  KEYSTORE_PASSWORD: android
  KEYSTORE_ALIAS: androiddebugkey
  KEYSTORE_ALIAS_PASSWORD: android

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore Util/android.keystore -storetype JKS \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, OU=Android, O=Android, L=Unknown, S=Unknown, C=US"

      - name: Write build recipe
        run: |
          cat > Util/recipe.lua << 'EOF'
          local root = os.getenv('GITHUB_WORKSPACE') or os.getenv('WORKSPACE')
          return {
          	appName = os.getenv('APP_NAME'),
          	androidAppPackage = os.getenv('APP_PACKAGE'),
          	androidStore = "google",
          	platform = "android",
          	appVersion = os.getenv('APP_VERSION_NAME'),
          	androidVersionCode = os.getenv('APP_VERSION_CODE'),
          	projectPath = root .. "/Project",
          	dstPath = root .. '/Output',
          	certificatePath = root .. "/Util/android.keystore",
          	keystorePassword = os.getenv('KEYSTORE_PASSWORD'),
          	keystoreAlias = os.getenv('KEYSTORE_ALIAS'),
          	keystoreAliasPassword = os.getenv('KEYSTORE_ALIAS_PASSWORD'),
          }
          EOF

      - name: Unpack project
        run: |
          rm -rf Project
          mkdir Project
          unzip -o ./*.zip -d Project

      - name: Build Android
        run: Util/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: Output/

name: Build Solar2D APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Solar2D via Chocolatey
        run: |
          choco install solar2d -y
        shell: pwsh

      - name: Build Android App
        run: |
          $paths = @(
              "C:\Program Files (x86)\Corona Labs\Corona\Corona Simulator.exe",
              "C:\Solar2D\Corona Simulator.exe",
              "$env:LOCALAPPDATA\Corona Labs\Corona Simulator.exe",
              "C:\ProgramData\chocolatey\lib\solar2d\tools\Corona Simulator.exe"
          )
          $simulator = $null
          foreach ($p in $paths) {
              if (Test-Path $p) {
                  $simulator = $p
                  break
              }
          }
          if (-eq $null) {
              $simulator = (Get-ChildItem -Path "C:\" -Filter "Corona Simulator.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          
          if ($simulator) {
              Write-Host "Found simulator at: $simulator"
              & "$simulator" /app="$PWD" /build=android
          } else {
              Write-Error "Corona Simulator not found!"
              exit 1
          }
        shell: pwsh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: |
            *.apk
            **/*.apk
            

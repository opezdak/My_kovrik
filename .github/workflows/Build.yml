name: Build Solar2D APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Solar2D Archive
        run: |
          $zipPath = "$PSScriptRoot\solar2d.zip"
          $extractPath = "C:\Solar2D"
          
          # Скачиваем стабильный архив движка
          $url = "https://github.com/coronalabs/corona/releases/download/2024.3705/Solar2D-2024.3705.win32.zip"
          # Если прямая ссылка заблокирована, используем альтернативный метод загрузки
          Invoke-WebRequest -Uri "https://github.com/coronalabs/corona/releases/download/2024.3705/Solar2D-2024.3705.exe" -OutFile "$PSScriptRoot\installer.exe"
          Start-Process -FilePath "$PSScriptRoot\installer.exe" -ArgumentList "/S", "/D=C:\Solar2D" -Wait
        shell: pwsh

      - name: Build Android App
        run: |
          $simulator = "C:\Solar2D\Corona Simulator.exe"
          if (-not (Test-Path $simulator)) {
              $simulator = "C:\Program Files (x86)\Corona Labs\Corona\Corona Simulator.exe"
          }
          if (-not (Test-Path $simulator)) {
              $simulator = (Get-ChildItem -Path "C:\" -Filter "Corona Simulator.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if ($simulator) {
              Write-Host "Building using: $simulator"
              & "$simulator" /app="$PWD" /build=android
          } else {
              Write-Error "Simulator not found!"
              exit 1
          }
        shell: pwsh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: |
            *.apk
            **/*.apk
            

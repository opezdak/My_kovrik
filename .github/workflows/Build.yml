name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          curl -sL https://solar2d.com/download.sh | bash
          $HOME/.solar2d/bin/solar2d build --platform android --output game.apk .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game
          path: game.apk
          
